<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <title>Remote control</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: transparent;
      overflow: hidden;
      font: 13px/1 -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif;
      user-select: none;
    }
    .bar {
      box-sizing: border-box;
      height: 44px;
      margin: 4px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 6px 0 14px;
      border-radius: 999px;
      background: rgba(30, 31, 36, 0.96);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #f1f1f4;
      white-space: nowrap;
      -webkit-app-region: drag;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #60a5fa;
      flex-shrink: 0;
      animation: live 1.6s ease-in-out infinite;
    }
    .paused .dot { background: #fbbf24; animation: none; }
    .text { font-weight: 600; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
    .keys { color: rgba(255, 255, 255, 0.55); font-size: 12px; }
    button {
      -webkit-app-region: no-drag;
      appearance: none;
      border: 0;
      height: 32px;
      padding: 0 16px;
      border-radius: 999px;
      background: #ef4444;
      color: #fff;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      flex-shrink: 0;
    }
    button:hover { background: #f87171; }
    @keyframes live { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
    @media (prefers-reduced-motion: reduce) { .dot { animation: none; } }
  </style>
</head>
<body>
  <div class="bar" id="bar" role="status" aria-live="polite">
    <span class="dot" aria-hidden="true"></span>
    <span class="text" id="text">Someone is controlling your screen</span>
    <span class="keys" id="keys"></span>
    <button type="button" id="stop">Stop control</button>
  </div>
  <script>
    const bar = document.getElementById('bar');
    const text = document.getElementById('text');
    const keys = document.getElementById('keys');
    document.getElementById('stop').addEventListener('click', () => window.rcBar && window.rcBar.stop());
    if (window.rcBar) {
      window.rcBar.onState((state) => {
        const name = (state && state.name) || 'Someone';
        bar.classList.toggle('paused', !!(state && state.paused));
        text.textContent = state && state.paused
          ? 'Paused while you use your mouse'
          : name + ' is controlling your screen';
        keys.textContent = state && state.shortcut ? state.shortcut + ' to stop' : '';
      });
    }
  </script>
</body>
</html>
