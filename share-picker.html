<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Share your screen</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        flex-direction: column;
        background: #16171f;
        color: #f2f3f7;
        font: 14px/1.4 -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        user-select: none;
        -webkit-user-select: none;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 20px 24px 16px;
      }
      h1 {
        margin: 0;
        font-size: 18px;
        font-weight: 600;
      }
      .tabs {
        display: flex;
        gap: 2px;
        padding: 3px;
        border-radius: 10px;
        background: #0e0f15;
      }
      .tabs button {
        min-width: 88px;
        height: 30px;
        padding: 0 14px;
        border: 0;
        border-radius: 8px;
        background: transparent;
        color: #a5a8b8;
        font: inherit;
        cursor: pointer;
      }
      .tabs button[aria-selected='true'] {
        background: #2a2c3a;
        color: #fff;
      }
      main {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding: 4px 24px 16px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(232px, 1fr));
        gap: 14px;
      }
      .card {
        display: block;
        width: 100%;
        padding: 0;
        border: 2px solid transparent;
        border-radius: 12px;
        background: transparent;
        color: inherit;
        font: inherit;
        text-align: left;
        cursor: pointer;
      }
      .card:focus-visible {
        outline: 2px solid #8b89ff;
        outline-offset: 2px;
      }
      .card[aria-pressed='true'] {
        border-color: #6a68f5;
        box-shadow: 0 0 0 3px rgba(94, 92, 230, 0.3);
      }
      .frame {
        display: flex;
        align-items: center;
        justify-content: center;
        aspect-ratio: 16 / 10;
        overflow: hidden;
        border-radius: 10px 10px 0 0;
        background: #0b0c10;
      }
      .frame img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      .empty {
        width: 40px;
        height: 40px;
        object-fit: contain;
      }
      .name {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 38px;
        padding: 0 10px;
        border-radius: 0 0 10px 10px;
        background: #20222d;
      }
      .card:hover .name {
        background: #292b39;
      }
      .name img {
        flex: none;
        width: 18px;
        height: 18px;
      }
      .name span {
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .none {
        padding: 72px 0;
        color: #a5a8b8;
        text-align: center;
      }
      footer {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 14px 24px;
        border-top: 1px solid #2a2c3a;
      }
      .sound {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-right: auto;
        cursor: pointer;
      }
      .sound input {
        position: absolute;
        opacity: 0;
      }
      .switch {
        position: relative;
        width: 36px;
        height: 20px;
        border-radius: 10px;
        background: #3a3d4e;
        transition: background 0.15s;
      }
      .switch::after {
        content: '';
        position: absolute;
        top: 2px;
        left: 2px;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: #fff;
        transition: transform 0.15s;
      }
      .sound input:checked + .switch {
        background: #5e5ce6;
      }
      .sound input:checked + .switch::after {
        transform: translateX(16px);
      }
      .sound input:focus-visible + .switch {
        outline: 2px solid #8b89ff;
        outline-offset: 2px;
      }
      footer button {
        min-width: 88px;
        height: 36px;
        padding: 0 18px;
        border: 0;
        border-radius: 10px;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      #cancel {
        background: #2a2c3a;
        color: #f2f3f7;
      }
      #share {
        background: linear-gradient(135deg, #6a5cf4, #4d6cf5);
        color: #fff;
      }
      #share:disabled {
        background: #2a2c3a;
        color: #6f7283;
        cursor: default;
      }
    </style>
  </head>
  <body>
    <header>
      <h1 id="title"></h1>
      <div class="tabs" role="tablist">
        <button id="screen" role="tab"></button>
        <button id="window" role="tab"></button>
      </div>
    </header>
    <main><div class="grid" id="grid"></div></main>
    <footer>
      <label class="sound">
        <input id="sound" type="checkbox" />
        <span class="switch"></span>
        <span id="soundLabel"></span>
      </label>
      <button id="cancel"></button>
      <button id="share" disabled></button>
    </footer>
    <script>
      const words = {
        en: {
          title: 'Share your screen',
          screen: 'Screens',
          window: 'Windows',
          sound: 'Share computer sound',
          cancel: 'Cancel',
          share: 'Share',
          none: 'Nothing to share here',
        },
        zh: {
          title: '共享屏幕',
          screen: '屏幕',
          window: '窗口',
          sound: '共享电脑声音',
          cancel: '取消',
          share: '共享',
          none: '这里没有可共享的内容',
        },
      };
      const el = (id) => document.getElementById(id);
      const state = { tab: 'screen', picked: null, items: [], text: words.en };

      const done = (id) =>
        window.sharePicker.done(id ? { id, sound: el('sound').checked } : null);

      function pick(id) {
        state.picked = id;
        el('share').disabled = !id;
        document.querySelectorAll('.card').forEach((card) => {
          card.setAttribute('aria-pressed', String(card.dataset.id === id));
        });
      }

      function card(item) {
        const node = document.createElement('button');
        node.className = 'card';
        node.dataset.id = item.id;
        node.setAttribute('aria-pressed', String(state.picked === item.id));
        node.onclick = () => pick(item.id);
        node.ondblclick = () => done(item.id);

        const frame = document.createElement('div');
        frame.className = 'frame';
        const shot = document.createElement('img');
        frame.append(shot);

        const name = document.createElement('div');
        name.className = 'name';
        const label = document.createElement('span');
        label.textContent = item.name;
        label.title = item.name;
        if (item.icon) {
          const icon = document.createElement('img');
          icon.src = item.icon;
          name.append(icon);
        }
        name.append(label);

        node.append(frame, name);
        paint(node, item);
        return node;
      }

      /** Keeps the grid in place while previews refresh, so nothing jumps under the pointer. */
      function paint(node, item) {
        const shot = node.querySelector('.frame img');
        const src = item.shot || item.icon || '';
        if (shot.getAttribute('src') !== src) shot.src = src;
        shot.className = item.shot ? '' : 'empty';
      }

      function render() {
        const grid = el('grid');
        const items = state.items.filter((item) => item.kind === state.tab);
        const ids = items.map((item) => item.id).join('\n');
        if (grid.dataset.ids !== ids || !items.length) {
          grid.dataset.ids = ids;
          grid.replaceChildren(...items.map(card));
          if (!items.length) {
            const none = document.createElement('div');
            none.className = 'none';
            none.textContent = state.text.none;
            grid.append(none);
          }
        } else {
          items.forEach((item, index) => paint(grid.children[index], item));
        }
        el('screen').setAttribute('aria-selected', String(state.tab === 'screen'));
        el('window').setAttribute('aria-selected', String(state.tab === 'window'));
      }

      function tab(next) {
        state.tab = next;
        const items = state.items.filter((item) => item.kind === next);
        pick(items.length === 1 ? items[0].id : null);
        render();
        pick(state.picked);
      }

      window.sharePicker.onSources((data) => {
        state.items = data.items;
        if (data.first) {
          state.text = data.zh ? words.zh : words.en;
          document.title = state.text.title;
          el('title').textContent = state.text.title;
          el('screen').textContent = state.text.screen;
          el('window').textContent = state.text.window;
          el('soundLabel').textContent = state.text.sound;
          el('cancel').textContent = state.text.cancel;
          el('share').textContent = state.text.share;
          el('sound').checked = data.sound;
          tab('screen');
          return;
        }
        if (state.picked && !data.items.some((item) => item.id === state.picked)) pick(null);
        render();
      });

      el('screen').onclick = () => tab('screen');
      el('window').onclick = () => tab('window');
      el('cancel').onclick = () => done(null);
      el('share').onclick = () => done(state.picked);
      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape') done(null);
        if (event.key === 'Enter' && state.picked && !event.target.closest('#cancel')) done(state.picked);
      });
    </script>
  </body>
</html>
