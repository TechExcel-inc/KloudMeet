<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>更新进度</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #0f172a;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      .card {
        height: 100%;
        box-sizing: border-box;
        padding: 14px 16px 16px;
        border: 1px solid rgba(255, 255, 255, 0.22);
        border-radius: 10px;
        background: #0f172a;
        -webkit-app-region: drag;
        cursor: grab;
      }
      .card:active {
        cursor: grabbing;
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 15px;
        font-weight: 600;
        line-height: 1.2;
        color: #f8fafc;
      }
      #pct {
        font-size: 18px;
        color: #5eead4;
      }
      .bar-outer {
        margin-top: 12px;
        height: 8px;
        border-radius: 4px;
        background: rgba(255, 255, 255, 0.16);
        overflow: hidden;
      }
      .bar-inner {
        height: 100%;
        border-radius: 4px;
        width: 0%;
        background: linear-gradient(90deg, #34d399, #22d3ee);
        transition: width 0.12s ease-out;
      }
    </style>
  </head>
  <body>
    <div class="card" title="可拖动">
      <div class="row">
        <span>正在下载新版本</span>
        <span id="pct">0%</span>
      </div>
      <div class="bar-outer"><div id="fill" class="bar-inner"></div></div>
    </div>
    <script>
      (function () {
        var pctEl = document.getElementById('pct');
        var fillEl = document.getElementById('fill');
        if (window.updateProgress && typeof window.updateProgress.onProgress === 'function') {
          window.updateProgress.onProgress(function (p) {
            var n = typeof p.percent === 'number' && !isNaN(p.percent) ? p.percent : 0;
            n = Math.min(100, Math.max(0, Math.round(n)));
            pctEl.textContent = n + '%';
            fillEl.style.width = n + '%';
          });
        }
      })();
    </script>
  </body>
</html>
