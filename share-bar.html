<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <title>Sharing</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: transparent;
      overflow: hidden;
      font: 13px/1 -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      user-select: none;
    }
    .bar {
      box-sizing: border-box;
      height: calc(100% - 8px);
      margin: 4px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 8px 0 14px;
      border-radius: 999px;
      background: rgba(22, 23, 28, 0.96);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #f4f4f6;
      white-space: nowrap;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #00d26a;
      flex-shrink: 0;
    }
    .label {
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
    }
    .tools {
      display: none;
      align-items: center;
      gap: 6px;
      margin-left: auto;
    }
    .open .tools { display: flex; }
    button {
      appearance: none;
      border: 0;
      height: 32px;
      padding: 0 12px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.1);
      color: #f4f4f6;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      flex-shrink: 0;
    }
    button:hover { background: rgba(255, 255, 255, 0.18); }
    button.on { background: rgba(0, 210, 106, 0.22); color: #7dffc3; }
    button.off { background: rgba(239, 68, 68, 0.18); color: #fda4a4; }
    #stop { background: #ef4444; color: #fff; }
    #stop:hover { background: #f87171; }
  </style>
</head>
<body>
  <div class="bar" id="bar">
    <span class="dot" aria-hidden="true"></span>
    <span class="label" id="label">You're sharing</span>
    <div class="tools">
      <button type="button" id="mic">Microphone</button>
      <button type="button" id="annotate">Annotate</button>
      <button type="button" id="stop">Stop sharing</button>
    </div>
  </div>
  <script>
    const bar = document.getElementById('bar');
    const label = document.getElementById('label');
    const mic = document.getElementById('mic');
    const annotate = document.getElementById('annotate');
    const stop = document.getElementById('stop');
    const words = {
      en: { sharing: "You're sharing", mic: 'Microphone', muted: 'Muted', annotate: 'Annotate', stop: 'Stop sharing' },
      zh: { sharing: '正在共享', mic: '麦克风', muted: '已静音', annotate: '批注', stop: '停止共享' },
    };

    let collapseTimer = 0;
    const hover = (open) => {
      clearTimeout(collapseTimer);
      if (open) {
        window.shareBar && window.shareBar.hover(true);
        return;
      }
      collapseTimer = setTimeout(() => {
        window.shareBar && window.shareBar.hover(false);
      }, 220);
    };
    document.documentElement.addEventListener('mouseenter', () => hover(true));
    document.documentElement.addEventListener('mouseleave', () => hover(false));

    mic.addEventListener('click', () => window.shareBar && window.shareBar.action('mic'));
    annotate.addEventListener('click', () => window.shareBar && window.shareBar.action('annotate'));
    stop.addEventListener('click', () => window.shareBar && window.shareBar.action('stop'));

    if (window.shareBar) {
      window.shareBar.onState((state) => {
        const text = state && state.zh ? words.zh : words.en;
        const micOn = !state || state.micOn !== false;
        const drawing = !!(state && state.annotating);
        bar.classList.toggle('open', !!(state && state.open));
        label.textContent = text.sharing;
        mic.textContent = micOn ? text.mic : text.muted;
        mic.classList.toggle('off', !micOn);
        mic.setAttribute('aria-pressed', micOn ? 'true' : 'false');
        annotate.textContent = text.annotate;
        annotate.classList.toggle('on', drawing);
        annotate.setAttribute('aria-pressed', drawing ? 'true' : 'false');
        stop.textContent = text.stop;
      });
    }
  </script>
</body>
</html>
